name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Runs on all three developer OSes: the team is split across Windows and macOS,
  # and path, line-ending, and shell differences only ever show up on the OS you
  # are not using.
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  # Semgrep's stock p/default ruleset. No Semgrep AppSec Platform account and no
  # secrets, so this runs on forks too. p/default is used rather than the narrower
  # p/typescript, p/react and p/secrets packs: those three returned zero findings
  # even against deliberately vulnerable code, so they would be a gate that cannot
  # fail. Fails the PR on ERROR findings only, since a check people learn to
  # ignore is worse than no check.
  # Linux only: GitHub Actions job containers do not run on Windows or macOS
  # runners, and the scan is OS-independent anyway.
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@v7

      - run: semgrep scan --config p/default --severity ERROR --error
