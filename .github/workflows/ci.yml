name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Runs on all three developer OSes: the team is split across Windows and macOS,
  # and path, line-ending, and shell differences only ever show up on the OS you
  # are not using.
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # Edge Function: typecheck, lint, and unit tests (providers faked, no network).
      # Run from the function folder so Deno uses its deno.json, not the root package.json.
      - name: send-alert function
        working-directory: supabase/functions/send-alert
        run: npx deno check index.ts && npx deno lint && npx deno test

      - name: end-alert function
        working-directory: supabase/functions/end-alert
        run: npx deno check index.ts && npx deno lint && npx deno test

      - name: sms-status function
        working-directory: supabase/functions/sms-status
        run: npx deno check index.ts && npx deno lint && npx deno test

  # pgTAP tests (RLS and constraints) against a local Postgres, plus a check that the
  # committed DB types match the migrations. Linux only: the Supabase CLI runs
  # Postgres in Docker, which GitHub provides only on ubuntu runners.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx supabase db start

      - run: npx supabase test db

      - name: DB types are up to date
        run: |
          npx supabase gen types typescript --local > supabase/types/database.ts
          git diff --exit-code supabase/types/database.ts

  # Semgrep's stock p/default ruleset. No Semgrep AppSec Platform account and no
  # secrets, so this runs on forks too. p/default is used rather than the narrower
  # p/typescript, p/react and p/secrets packs: those three returned zero findings
  # even against deliberately vulnerable code, so they would be a gate that cannot
  # fail. Fails the PR on ERROR findings only, since a check people learn to
  # ignore is worse than no check.
  # Linux only: GitHub Actions job containers do not run on Windows or macOS
  # runners, and the scan is OS-independent anyway.
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@v7

      - run: semgrep scan --config p/default --severity ERROR --error
